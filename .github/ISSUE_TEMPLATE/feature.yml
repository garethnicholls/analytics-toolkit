name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What decision or task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Analytics and privacy considerations
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options: [Journey analysis, Mobile interface, BigQuery query, Route configuration, Identity handling, Developer experience]
    validations:
      required: true
